[project]
name = "local-calendar"
version = "1.0.0"
description = "Minimal local Needle 2 calendar agent with Gemma 4 E2B (Cactus) on Raspberry Pi 5."
requires-python = ">=3.12"
dependencies = [
    "cactus-needle==2.0.13",
    "pydantic==2.13.5",
    "gradio==6.27.0",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot==22.8", "python-dotenv==1.1.1"]

[project.scripts]
local-calendar = "local_calendar.app:main"
local-calendar-telegram = "local_calendar.telegram:main"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_calendar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needle: tests that load the Needle engine (deselect with '-m \"not needle\"')",
    "gemma: tests that need a running cactus serve",
]
